[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.6"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/jrh89/hive"
homepage = "https://hive.codefrontlabs.com"

[workspace.dependencies]
hive-protocol = { path = "crates/hive-protocol" }
hive-core = { path = "crates/hive-core" }
hive-daemon = { path = "crates/hive-daemon" }
hive-tui = { path = "crates/hive-tui" }
hive-workspace = { path = "crates/hive-workspace" }
hive-agents = { path = "crates/hive-agents" }

[profile.release]
lto = "thin"
# Keep symbols so panics in bug reports have readable backtraces.
strip = "debuginfo"
