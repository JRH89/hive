# Hive configuration: ~/.config/hive/config.toml (or $HIVE_CONFIG).
# Every key is optional; this file shows the defaults and some examples.
# A test parses and validates this file, so it stays accurate.

[general]
default_agent = "claude"
# hive-dark (default), hive-light, ansi (16 colours), mono (no colour)
theme = "hive-dark"

[branding]
show_header = true
show_tagline = true

[terminal]
scrollback_lines = 10000
# Click sessions, scroll, and pass the mouse to agents that use it.
# Hold Shift to select text natively.
mouse_support = true

[daemon]
auto_start = true
# Seconds between SIGTERM and SIGKILL when terminating a session.
kill_timeout_secs = 3

[notifications]
# Ring the terminal bell when a session you aren't viewing needs input
# (blocked) or finishes its turn (done).
bell = true


# Optional integrations. Off by default and invisible until enabled.
[integrations.obsidian]
# Leader N opens the workspace's Obsidian vault (a folder with .obsidian/,
# at or above the session's directory or one level below the repository
# root) in a pane. Asking again focuses the open one.
enabled = false
agent = ""          # agent to open it with; "" = $VISUAL, $EDITOR, else vi
open_in = "tab"     # or "split"
journal = false     # append a line to today's note when an agent finishes
journal_dir = ""    # folder of daily notes in the vault; "" = vault root

[integrations.review]
# Leader G: review changes in the focused session's directory.
enabled = false
command = []        # [] = lazygit, else tig, else git diff
open_in = "split"

[integrations.github]
# Leader H: pull request checks for the session's branch.
enabled = false
command = []        # [] = ["gh", "pr", "checks", "--watch"]
open_in = "split"

[integrations.tasks]
# Leader T: pick a just/package.json/make/cargo task to run beside the agent.
enabled = false
open_in = "split"

[integrations.desktop_notify]
# A desktop notification when a session you aren't viewing needs input or
# finishes. The title and body are appended to the command.
enabled = false
command = ["notify-send", "--app-name=Hive"]

[integrations.git_status]
# Changed files and commits ahead/behind under each repository space in the
# sidebar (e.g. "main  ~3 ↑2"), refreshed every few seconds.
enabled = false

[integrations.usage]
# Leader U: token usage and cost of your agents in a pane. Agents keep their
# own logs; this opens a tool that reads them (default: ccusage blocks --live,
# `npm i -g ccusage`).
enabled = false
command = []
open_in = "split"

# Layouts: panes opened together in a new tab with Leader L. In a space
# listed in `spaces` it opens without asking; otherwise you pick one.
# Panes: agent (default "shell"), run (argv instead of an agent),
# split ("right" or "down", from the previous pane), label.
# [layouts.web]
# spaces = ["web"]
# panes = [
#   { agent = "claude" },
#   { run = ["npm", "run", "dev"], split = "right", label = "server" },
#   { split = "down" },
# ]

[worktrees]
# Where `hive new -w` creates git worktrees.
# Default: $XDG_DATA_HOME/hive/worktrees
# dir = "/home/me/worktrees"

[theme]
# auto picks from COLORTERM / TERM / NO_COLOR: truecolor, 256, 16 or none.
colors = "auto"
# auto picks ascii on the Linux console or without a UTF-8 locale.
glyphs = "auto"
# Override any colour of the base theme with #rrggbb:
# accent = "#F2B84B"
# accent_dim = "#D99A2B"
# surface = "#1C2028"
# text = "#E8EAF0"
# muted = "#8992A3"
# success = "#79C99E"
# warning = "#E8AE55"
# error = "#E57373"

[keys]
# Pressed before every Hive command. Everything else goes to the agent.
# Must use Ctrl or Alt (or be an F-key). Pressing it twice sends it to the agent.
leader = "ctrl+space"
# Alt+1-9 jump to sessions without the leader. "ctrl+alt", or "" for off.
jump_modifier = "alt"

[keys.bind]
# Command = key or list of keys, pressed after the leader. Setting a command
# replaces its default keys; [] unbinds it. 1-9 always jump to sessions.
# Commands (all listed at https://hive.codefrontlabs.com/docs/keys/):
# palette, search_sessions, new_session, new_agent, new_worktree_terminal,
# new_worktree_session, new_space, workspaces, add_workspace, rename_workspace,
# next_session, prev_session, next_workspace, prev_workspace, sidebar,
# toggle_sidebar, split_right, split_down, focus_next_pane, zoom, close_pane,
# new_tab, next_tab, prev_tab, close_tab, rename_session, kill_session,
# take_control, detach, help, integrations, settings, layout (with [layouts]),
# notes, review, pull_request, run_task, usage (with their [integrations.*])
palette = [":", "P"]
new_session = "c"
next_session = ["n", "j", "down"]
prev_session = ["p", "k", "up"]
toggle_sidebar = "b"

[keys.global]
# Prefix-free keys, active even while typing to an agent (need Ctrl or Alt).
# Same command names. [] frees a key for the agent.
next_tab = "alt+right"        # with one tab: the next agent in the space
prev_tab = "alt+left"
next_workspace = "alt+down"
prev_workspace = "alt+up"

# Agents. Built in: every agent `hive agents --all` lists, plus shell. Add your own or
# override a built-in. Commands run directly (no shell); args are passed as-is.
[agents.aider]
command = "aider"
args = ["--dark-mode"]

[agents.claude-opus]
command = "claude"
args = ["--model", "opus"]
env = { CLAUDE_CODE_USE_BEDROCK = "0" }
