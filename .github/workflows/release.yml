name: Release

# Pushing a tag like v0.2.0 builds static Linux, macOS and Windows binaries
# and creates a *draft* GitHub release. A maintainer reviews and publishes it
# by hand.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          # Cross-built on Apple silicon; tested natively by the arm64 job.
          - { target: x86_64-apple-darwin, os: macos-15, cross: true }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the crate version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --workspace --locked
        if: ${{ !matrix.cross }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: scripts/smoke.sh target/${{ matrix.target }}/release
        if: ${{ !matrix.cross && runner.os != 'Windows' }}
      - run: scripts/smoke.ps1 target/${{ matrix.target }}/release
        if: ${{ runner.os == 'Windows' }}
      - run: scripts/package.sh ${{ matrix.target }} dist
        if: ${{ runner.os != 'Windows' }}
      - run: scripts/package.ps1 ${{ matrix.target }} dist
        if: ${{ runner.os == 'Windows' }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: cp scripts/install.sh scripts/install.ps1 dist/
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Hive $GITHUB_REF_NAME" --generate-notes
