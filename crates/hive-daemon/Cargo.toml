[package]
name = "hive-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hived"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
hive-agents = { version = "0.2.0", path = "../hive-agents" }
hive-core = { version = "0.2.0", path = "../hive-core" }
hive-protocol = { version = "0.2.0", path = "../hive-protocol" }
hive-workspace = { version = "0.2.0", path = "../hive-workspace" }
portable-pty = "0.9.0"
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3.27.0"
vt100 = "0.18.1"
