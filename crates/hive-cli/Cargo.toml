[package]
name = "hive-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hive"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hive-core = { version = "0.1.0", path = "../hive-core" }
hive-daemon = { version = "0.1.0", path = "../hive-daemon" }
hive-protocol = { version = "0.1.0", path = "../hive-protocol" }
hive-tui = { version = "0.1.0", path = "../hive-tui" }
hive-workspace = { version = "0.1.0", path = "../hive-workspace" }
ratatui = "0.30.2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
