[package]
name = "hive-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "7.0.0"
hive-agents = { version = "0.4.12", path = "../hive-agents" }
hive-protocol = { version = "0.4.12", path = "../hive-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "rt"] }
toml = "1.1.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.27.0"
