[package]
name = "hive-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs = "7.0.0"
hive-agents = { version = "0.3.0", path = "../hive-agents" }
hive-protocol = { version = "0.3.0", path = "../hive-protocol" }
rustix = { version = "1.1.6", features = ["process", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "rt"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
